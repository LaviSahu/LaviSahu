<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Lavi Sahu. Supply-chain planning practitioner. 14 years in SAP IBP, o9, Kinaxis and OMP. lavisahu.com">
<style>
@font-face{font-family:'Brico';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'Mono';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'DM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}
.k{font:700 15px Mono,monospace;letter-spacing:3px;fill:#ffc73a}
.n{font:700 84px Brico,sans-serif;letter-spacing:-2px}
.t{font:400 20px DM,sans-serif;fill:#a9a3bd}
.u{font:400 16px Mono,monospace;fill:#1fc9a4}
.edge{fill:none;stroke:#fffdf8;stroke-opacity:.16;stroke-width:2;stroke-dasharray:4 6}
.in{opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
.node{opacity:0;animation:pop .6s ease-out forwards}
.bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow .7s cubic-bezier(.2,.8,.2,1) forwards}
.caret{animation:blink 1s steps(1) infinite}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0}to{opacity:1}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.in,.node,.bar{animation:none;opacity:1;transform:none}.caret{animation:none}}
</style>
<defs>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fffdf8" opacity=".07"/></pattern>
<radialGradient id="glow" cx="80%" cy="50%" r="45%"><stop offset="0" stop-color="#6c4cf1" stop-opacity=".28"/><stop offset="1" stop-color="#6c4cf1" stop-opacity="0"/></radialGradient>
<clipPath id="round"><rect width="1280" height="320" rx="18"/></clipPath>
</defs>
<g clip-path="url(#round)">
<rect width="1280" height="320" fill="#181425"/>
<rect width="1280" height="320" fill="url(#dots)"/>
<rect width="1280" height="320" fill="url(#glow)"/>
<text class="k in" x="64" y="82" style="animation-delay:.05s">SUPPLY-CHAIN PLANNING PRACTITIONER</text>
<text class="n in" x="60" y="172" style="animation-delay:.2s"><tspan fill="#fffdf8">Lavi </tspan><tspan fill="#6c4cf1">Sahu</tspan></text>
<text class="t in" x="64" y="218" style="animation-delay:.4s">14 years in SAP IBP, o9, Kinaxis and OMP.</text>
<text class="t in" x="64" y="246" style="animation-delay:.5s">Testing what AI actually does for planning.</text>
<g class="in" style="animation-delay:.7s"><text class="u" x="64" y="282">→ lavisahu.com</text><rect class="caret" x="200" y="268" width="9" height="17" fill="#1fc9a4"/></g>
